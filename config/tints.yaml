# Tint mapping: block ID -> tint type. Missing blocks are rendered without tint.
# Stems, lava/powder_snow cauldrons, and the stonecutter tint by growth stage
# or white (a no-op) in vanilla, so they are intentionally not listed.
tints:
  # Grass tint
  minecraft:grass_block: grass
  minecraft:short_grass: grass
  minecraft:tall_grass: grass
  minecraft:fern: grass
  minecraft:large_fern: grass
  minecraft:potted_fern: grass
  minecraft:pink_petals: grass
  minecraft:sugar_cane: grass

  # Foliage tint
  minecraft:oak_leaves: foliage
  minecraft:birch_leaves: foliage
  minecraft:spruce_leaves: foliage
  minecraft:jungle_leaves: foliage
  minecraft:acacia_leaves: foliage
  minecraft:dark_oak_leaves: foliage
  minecraft:cherry_leaves: foliage
  minecraft:mangrove_leaves: foliage
  minecraft:vine: foliage
  minecraft:lily_pad: foliage
  minecraft:bamboo: foliage
  minecraft:bamboo_sapling: foliage

  # Water tint
  minecraft:water_cauldron: water

  # Redstone tint
  minecraft:redstone_wire: redstone
